<ul [class.expanded]="menuOpen">
  @for (menuItem of menu; track menuItem) {
    <li>
      <a
        [routerLink]="menuItem.link"
        (click)="toggleMenu()"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
      >
        {{ menuItem.title }}
      </a>
    </li>
  }
</ul>
